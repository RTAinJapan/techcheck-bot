# 型の確認・試験・ビルド
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチ / PR に続けて push したら、前の run は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
