# 配信者に向けた文言 (日本語)。en.yaml と同じキー・同じ差し込み ({name}) にする (違えば bot は起動しない)。

start:
  wrongChannel: "配信テストは {channel} で `/techcheck start` を実行してください。"
  alreadyRunning: "配信テストは進行中です: {url}"
  alreadyQueued: "待ちの列に入っています ({position} 番目)。順番が来たらお知らせします。"
  threadCreated: "配信テストのスレッドを作りました。こちらで案内します: {url}"
  prepareProblem: "準備に問題がありました。運営が確認します。直りしだい順番をお知らせしますので、少しお待ちください。"

queue:
  joined: "今は別の方がテスト中です。待ちの列に入りました ({position} 番目)。順番が来たらお知らせします。"
  paused: "今は受付を止めています。待ちの列に入りました ({position} 番目)。再開したらお知らせします。"
  notQueued: "待ちの列には入っていません。"
  left: "待ちの列から抜けました。"
  notYourTurn: "今はあなたの順番ではありません。順番が来たらお知らせします。"
  removed: "2 回続けて「始める」が押されなかったので、待ちの列から外しました。もう一度 `/techcheck start` を実行してください。"
  yourTurn: "{user} 配信テストの順番が来ました。{minutes} 分以内に「始める」を押してください。"
  yourTurnDm: "配信テストの順番が来ました。{minutes} 分以内に、下のリンク先 (配信テストのチャンネル) のメッセージにある「始める」を押してください。この DM には返信しなくて構いません。"

button:
  expired: "このボタンはもう使えません。"
  notYours: "このボタンは配信者の方だけが押せます。"
  ack: "受け付けました。"
  claim: "始める"
  started: "配信を始めた"
  abort: "中断する"
  set: "設定した"
  yes: "はい"
  no: "いいえ"
  stepStart: "始める"
  cannotMute: "音を消せない"
  retry: "やり直す"
  next: "次へ進む"
  voiceSkip: "マイクは使わない"
  voiceRetry: "録り直す"
  voiceNext: "これでよい"
  done: "完了"
  webcamSkip: "web カメラは使わない"
  usageYes: "使う"
  usageMaybe: "未定"
  usageNo: "使わない"

prepare:
  preparing: "配信テストの準備をしています。1 分ほどお待ちください。"

# 本番で web カメラとマイクを使うか (スレッドを作った直後に聞く)。どちらかを使うなら、VDO.ninja を 1 回だけ開いてもらう。
# 「未定」は、使うものとして確かめる
usage:
  camera: |-
    準備の間に教えてください。本番で **web カメラ** を使いますか？
    (「未定」の場合は、使うものとして確認します。)
  mic: |-
    本番で **マイク** を使いますか？
  chosen: "→ **{answer}**"
  remind: "{user} 先に、上の質問 (web カメラとマイクを使うか) に答えてください。答えると次に進みます。"
  locked: "VDO.ninja の案内を始めたので、ここでは変えられません。使わない場合は、案内のメッセージのボタンを押してください。"
  answer:
    yes: "使う"
    maybe: "未定"
    no: "使わない"

guide:
  first: |-
    **配信テストを始めます。**
    1. 配布した OBS の設定 (**{profile}**) を使っているか確かめてください。出力は {width}x{height} / {fps} fps / {bitrate} kbps / キーフレーム間隔 {keyframe} 秒です。
    2. OBS の「設定 → 配信」で、サーバに次の URL を入れてください。
    ```
    {url}
    ```
    3. OBS で配信を始めてください。届いたらお知らせします。
    この URL は配信テスト用です。本番では、本番のときにお送りする URL を使ってください。
    このあと、映像の確認、音声の確認の順に進めます (全体で 10〜15 分)。

wait:
  arrived: "配信が届きました。そのまま 2 分ほど配信を続けてください。"
  # 届いていないのに OBS が配信中になっているのは、別の場所に送っているとき (相手に繋がらなければ、OBS は配信を始めない)
  remind: |-
    まだ配信が届いていません。
    OBS の「設定 → 配信」で、サーバが案内した URL と同じになっているかを確かめてください。
  opsChecking: "配信はサーバに届いていますが、受信側の状況を確認しています。少しお待ちください。"
  notYet: "まだ届いていません。届いたらこのスレッドでお知らせします。"
  arrivedWebcam: "配信が届きました。OBS の配信は、そのまま続けてください。"

metadata:
  noAudio: "音声がありません"
  mismatch: "配信の形が案内と違います ({actual})。OBS の出力を {width}x{height} / {fps} fps にしてください。"

audio:
  silent: |-
    ゲーム音が届いていません。
    ゲーム音が鳴っている場面に移動したり、OBS の音声の設定 (ゲーム音の入力とミュート) を確かめてください。

judge:
  ok: |-
    映像は問題なく届いています。本番も latency は **{latencyUs} μs** でお願いします。
    URL は、本番のときにお送りするものを使い、`latency=` を今回調整した値にしてください。
  okRtmp: "RTMP で映像は問題なく届いています。本番も RTMP でお願いします。"

latency:
  ask: |-
    映像が乱れる可能性があります。latency を **{latencyUs} μs** に上げてください。
    OBS の配信を止め、URL の `latency=` を **{latencyUs}** にして、配信を始め直してください。
    終わったら「設定した」を押してください。
    ```
    {url}
    ```
  remeasure: "latency {latencyUs} μs で計測し直します。そのまま配信を続けてください。"
  remind: "latency の変更を待っています。OBS の配信を止めて URL を変え、配信を始め直してください。"
  waitRestart: "ありがとうございます。配信を始め直すと続きに進みます。"

rtmp:
  ask: |-
    SRT では安定しないので、RTMP で試します。OBS の配信の設定を次のように変えて、配信を始め直してください。
    終わったら「設定した」を押してください。
    サーバ: `{url}`
    ストリームキー: `{key}`

    本番で配信するときのURLは、本番のときに改めてお送りするものを使ってください。
  arrived: "RTMP で届きました。そのまま 1 分ほど配信を続けてください。"
  remind: "RTMP への切り替えを待っています。OBS の配信の設定を変えて、配信を始め直してください。"
  waitArrive: "ありがとうございます。届いたら続きに進みます。"
  unavailable: "映像が安定しません。後ほど運営から連絡します。音声の確認は続けて進めます。"
  unstable: "RTMP でも映像が安定しません。後ほど運営から連絡します。音声の確認は続けて進めます。"

checks:
  intro: "次に、音声とその他の確認をします。手順ごとに「始める」を押してから、指示どおりにしてください。"
  header: "**手順 {n}/{total}**"
  noImage: "(こちらで配信の静止画を取れませんでした。OBS のプレビューを見て答えてください。)"
  running: "{seconds} 秒ほど続けてください…"
  cannotMuteRunning: "わかりました。ゲームの音をできるだけ小さくして、{seconds} 秒ほどそのままにしてください… (音声は、あとで運営が録画を聞いて確かめます)"
  cannotMuteResult: "ゲームの音を消せない"
  cannotMuteKeep: "(ゲームの音は、さきほどと同じ小さい音量のままにしてください。)"
  cannotMuteNg: "(ゲームの音が大きくなっただけのこともあります。心当たりが無ければ、そのまま「次へ進む」を押してください。運営が録画を聞いて確かめます。)"
  ok: "OK です。"
  recorded: "記録しました。"
  ng: "おかしいところがあります。"
  done: "確認はすべて終わりました。結果を見て「完了」を押してください。"
  skipped: "そのまま進めた"

# チェックの手順の文言。キーは手順の id (設定の checks、既定は src/checks.ts)。
# label: 結果のまとめでの手順の名前 (省くと id のまま出る) / text: 手順の指示 / failHint: 「おかしい」ときに伝える直し方。
# {seconds} は手順の秒数。
# 設定の checks に手順を足したら、ここにも text と failHint を足す (無ければ bot は起動しない)。
steps:
  game-audio:
    label: "ゲーム音が来ている"
    text: "ゲームの音を鳴らしてください。BGM や効果音が出る場面で、{seconds} 秒ほど続けます。"
    failHint: "ゲームの音が届いていません。OBS のゲーム音の入力 (キャプチャボード・アプリの音声キャプチャ) と、ミュートになっていないかを確かめてください。"
  silence:
    label: "無音シーン"
    # 「ミュートして」とだけ書くと、OBS の側でミュートしてしまい、配信に載る音の確認にならない。ゲームの側で音を止めてもらう
    text: |-
      OBS にゲーム音以外が入っていないことを確認します。
      まずはゲーム内の静かなシーンや、ゲーム内設定で音が出ない状態にしてください。
      ただし、OBS の設定 (ミュートや音量) は変えないでください。

      そのまま {seconds} 秒ほど静かにしてください。
      ゲームの音を完全には消せない場合は「音を消せない」を押してください。
    failHint: "音が載っているようです。キャプチャー時にノイズが入っていないか、ゲームの設定を確かめてください。"
  mic:
    label: "OBS にマイクが入っていない"
    text: "ゲームは無音状態のまま、マイクに向かって {seconds} 秒ほど話してください。"
    failHint: |-
      マイクの音が配信に入っています。
      OBS のマイクの入力を、配信の音声から外してください。
      マイク音はOBSではなく、別の経路で送ってもらいます。
  desktop:
    label: "OBS にゲーム以外のデスクトップ音などが入っていない"
    text: "ゲームは無音状態のまま、PC の音 (ブラウザの動画、Discord の通知音など) を {seconds} 秒ほど鳴らしてください。"
    failHint: "PC の音が配信に入っています。OBS のデスクトップ音声を、配信の音声から外してください。"
  picture:
    label: "送信されたゲーム映像が意図通り"
    # 静止画を付けられないときにも読める文にする。余白があってもよい (受ける側で切り抜く)
    text: "配信に映っている画面は正しいですか (ゲーム画面が全て映っている。余計なウインドウが無い)。"
    failHint: "OBS のシーンを直してから「やり直す」を押してください。"
  # 繋ぎ直しの手順。既定の手順には入れていない (設定の checks に足すときに使う)
  reconnect:
    label: "配信を始め直して戻れる"
    text: "OBS の配信を一度止めて、もう一度始めてください (本番中に切れたときの戻し方の練習です)。"
    failHint: "配信が戻ってきません。OBS の配信の設定 (URL) が保存されているかを確かめてください。"
  # マイクの声の録音 (VDO.ninja)。マイクを「使う」か「未定」と答えた人にだけ出す
  voice:
    label: "マイク音"
    text: |-
      (マイクを使う方だけ)
      VDO.ninja から届くマイクの声を録音します (あとで運営が聞いて確かめます)。
      「始める」を押してから、普段の声で {seconds} 秒ほど話してください。
      マイクを使わない方は「マイクは使わない」を押してください。
    failHint: "声が届いていません。web カメラのページで、マイクが選ばれているか、ミュートになっていないかを確かめてください。"

voice:
  recording: "録音しています。{seconds} 秒ほど、普段の声で話してください…"
  recorded: "録音しました (声が {seconds} 秒ぶん届きました)。あとで運営が聞いて確かめます。"
  retryHint: "マイクの音量を直して録り直すときは「録り直す」を、これでよければ「これでよい」を押してください。"
  notUsed: "マイクは使わない"
  level: "届いた声の音量: 最大 {max} dB、平均 {mean} dB (0 dB が上限です)。"
  waveform: "下の画像は、録音した声の波形です。上下の赤い線が上限で、そこに届いていると音が割れています。"
  clipped: "音が割れているところがあります。マイクの入力の音量を少し下げてみてください。"
  quiet: "声が小さめです。マイクの入力の音量を少し上げてみてください。"
  skipped: "マイクの確認は飛ばします。"
  failed: "こちらの都合で録音できませんでした。運営が確認します。このまま次へ進みます。"

# VDO.ninja (web カメラとマイク)。web カメラかマイクのどちらかを「使う」か「未定」と答えた人に、1 回だけ開いてもらう
webcam:
  ask: |-
    **web カメラとマイクの確認をします** (VDO.ninja)。OBS の配信は止めずに、そのまま続けてください。
    1. 次の URL を、本番で使う PC のブラウザ (Chrome を推奨) で開いてください。
    ```
    {url}
    ```
    2. {sources}
    3. 「START」を押してください。
    この URL は配信テスト用です。本番では、本番のときにお送りする URL を使ってください。
    届いたらお知らせします。
  # ask の 2. に入れる、カメラとマイクの選び方 (使うものに合わせて 1 つ)。
  # VDO.ninja の画面は日本語の環境でも英語のままなので、項目やボタンの名前は画面の表記のまま書く (訳さない)
  sourcesBoth: "カメラとマイクの使用を許可し、「Video Source」で本番で使うカメラを、「Audio Source(s)」で本番で使うマイクを選んでください。"
  sourcesCamera: "カメラの使用を許可し、「Video Source」で本番で使うカメラを選んでください。マイクは使わないので、「Audio Source(s)」は「No Audio」にしてください。"
  sourcesMic: "マイクの使用を許可し、「Audio Source(s)」で本番で使うマイクを選んでください。カメラは使わないので、「Video Source」は「Disable Video」にしてください。"
  # ask の最後に足す (カメラを「使う」か「未定」と答えた人だけ)
  skipHint: "web カメラを使わないことになった場合は「web カメラは使わない」を押してください。"
  arrived: "web カメラの映像が届きました。OBS の配信とカメラのページは、どちらもそのままにして、2 分ほどお待ちください (両方を送っている状態で、映像が乱れないかを確かめます)。"
  arrivedMic: "マイクの音声が届きました。OBS の配信と VDO.ninja のページは、どちらもそのままにして、2 分ほどお待ちください。"
  remind: "まだ web カメラの映像が届いていません。案内した URL を開いて、カメラを許可し、「START」を押したかを確かめてください。"
  remindMic: "まだマイクの音声が届いていません。案内した URL を開いて、マイクを許可し、「START」を押したかを確かめてください。"
  skippedMic: "web カメラの確認は飛ばします。マイクの音声が届くのを待ちます。"
  lost: |-
    web カメラの映像が届かなくなりました。カメラのページを開き直して、もう一度「START」を押してください。届いたら、映像の確認をやり直します。
    ```
    {url}
    ```
  # マイクだけ使う人の音声が、映像の判定の間に届かなくなったとき (両方を送っている状態で測り直すため)
  lostMic: |-
    VDO.ninja のマイクの音声が届かなくなりました。VDO.ninja のページを開き直して、もう一度「START」を押してください。届いたら、映像の確認をやり直します。
    ```
    {url}
    ```
  skipped: "web カメラの確認は飛ばします。そのまま 2 分ほど配信を続けてください。"
  failed: "こちらの都合で web カメラの映像を確認できませんでした。運営が確認します。カメラのページは閉じて、そのまま 2 分ほど配信を続けてください。"
  # マイクの録音の手順を出す時点で、VDO.ninja の音声が届いていないときだけ添える (届いていれば、開き直してもらうことは無い)
  micUrl: |-
    いま、VDO.ninja からマイクの音声が届いていません。VDO.ninja のページを閉じた場合は、次の URL を開き直し、マイクを許可して「START」を押してください。
    ```
    {url}
    ```
  micNotYet: |-
    マイクの音声がまだ届いていません。VDO.ninja のページを開いて、マイクを許可し、「START」を押してから、もう一度押してください。
    ```
    {url}
    ```

verdict:
  ok: "OK"
  ng: "おかしい"
  unknown: "記録のみ"

finish:
  summaryTitle: "**配信テストの結果**"
  abortedTitle: "**配信テストを中断しました**"
  protocol: "プロトコル: {protocol}"
  latency: "本番の latency: {latencyUs} μs"
  testUrls: "今回ご案内した URL は配信テスト用です。本番では、本番のときにお送りする URL を使ってください。"
  bye: "OBS の配信を止めてください。おつかれさまでした。"
  webcamClose: "web カメラのページ (ブラウザのタブ) を閉じてください。"

modal:
  doneTitle: "配信テストの完了"
  doneLabel: "気になったことがあれば書いてください (任意)"
  abortTitle: "配信テストの中断"
  abortLabel: "中断する理由 (任意)"
  received: "受け付けました。"
